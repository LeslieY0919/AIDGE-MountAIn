# Détecteur — MegaDetector v6 (MDv6-YOLOv10-c)
#
# Modèle pré-entraîné : il n'est PAS à réentraîner (le défi porte sur son
# déploiement efficace). Le fine-tuning de scripts/detector/finetune.py est
# une piste exploratoire, pas le chemin nominal.
#
# Les valeurs marquées [POSÉ] sont des hypothèses de dimensionnement, à
# confirmer sur la carte. Voir CLAUDE.md §2 et §6.

model:
  name: MDV6-yolov10-c
  # Résolution d'entrée. Les slides du kick-off montrent 240x240 par défaut ;
  # 320 est l'objectif (REQ-002). L'export v6 travaille à 640 sur hôte Linux,
  # ce qui ne tient pas dans le budget SRAM de l'E7 — voir memory_budget.
  input_size: 640
  target_input_size: 320        # [POSÉ] objectif embarqué, REQ-002
  opset: 18
  # Classes du détecteur, dans l'ordre des logits.
  classes: [animal, person, vehicle]

# Coupe du graphe avant le post-traitement YOLO. Le décodage DFL, la sigmoïde
# et le NMS sont refaits côté C++ : AIDGE n'exporte pas ces couches.
graph_cut:
  input_names: [images]
  output_names:
    - /model.23/Concat_output_0      # boxes : (1, 64, N)
    - /model.23/Concat_1_output_0    # scores : (1, 3, N)

# Post-traitement — la référence Python de mountain/ et le C++ de
# cpp/wildlife_pipeline doivent donner les mêmes boîtes à partir de ces
# valeurs. Tout écart se débogue en comparant les deux.
postprocess:
  conf_threshold: 0.25    # REQ-010 : écarter les détections sous ce score
  iou_threshold: 0.45     # REQ-011 : fusionner au-delà de cet IoU
  max_detections: 5       # REQ-012 : chaque imagette coûte de la SRAM
  dfl_bins: 16            # nb de bins de la distribution DFL par côté
  strides: [8, 16, 32]    # les trois échelles de la tête YOLO
  min_box_px: 24          # [POSÉ] REQ-033 : taille apparente minimale

# Fine-tuning exploratoire (scripts/detector/finetune.py). Hors chemin
# nominal : MegaDetector v6 n'est PAS à réentraîner, le défi porte sur son
# déploiement. Conservé parce que remapper les classes du dataset vers la
# classe 0 ('animal') permet de garder intacte la tête de classification.
finetune:
  epochs: 150             # arrêt automatique dès le plateau
  batch_size: 32          # dimensionné pour 16 Go de VRAM en 640x640
  target_precision: 0.85  # objectif de précision (P) et de mAP@50

# Budget mémoire de la cible Alif Ensemble E7 — le contrat le plus
# contraignant du projet. Informe le choix d'input_size.
memory_budget:
  sram_total_mb: 8.0      # REQ-004
  mram_total_mb: 4.5      # REQ-005
  detector_arena_mb: 2.5  # [POSÉ] REQ-102, -> ACTIVATION_BUF_SZ du build HP
  detector_weights_mb: 3.0  # [POSÉ] REQ-104
