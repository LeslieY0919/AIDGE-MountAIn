# Carte cible — Alif Ensemble E7 AppKit
#
# Branchée sur son port **PRG USB** (REQ-029). Ce port expose généralement
# deux interfaces série : celle du Secure Enclave et la console applicative.
# Les confondre est le piège n° 6 de CLAUDE.md.

# Référence attendue du composant. `connect.py --setools` vérifie que SETOOLS
# voit bien celle-ci, et pas un autre membre de la famille Ensemble.
part_number: AE722F80F55D5

serial:
  # Console applicative : c'est là que sortent les temps d'inférence (REQ-023).
  # [POSÉ] REQ-113 — valeur à confirmer sur la carte, voir CLAUDE.md §6.
  console_baud: 115200

  # UART du Secure Enclave, celle que SETOOLS utilise pour programmer la MRAM.
  # [SOURCÉ] Ce n'est PAS la console applicative : s'y connecter pour lire les
  # traces de l'application ne donne rien, et parler dessus pendant un flash
  # peut le faire échouer.
  se_baud: 55000

  # Nom de périphérique du Secure Enclave, tel que `tools-config -c` l'attend.
  # Sur Linux il vient d'une règle udev fournie par SETOOLS ; sur macOS le
  # port apparaît directement sous /dev/cu.usbmodem*.
  se_device: /dev/alif-se

  # Motifs de recherche des ports, par plateforme. `--port` passe outre.
  #
  # macOS : uniquement /dev/cu.* et jamais /dev/tty.*. Les deux nœuds
  # désignent le même port, mais /dev/tty.* est le côté « appel entrant » :
  # l'ouvrir bloque jusqu'à détection de porteuse (DCD), que la carte
  # n'assure pas. On y attend indéfiniment, sans message d'erreur.
  port_globs:
    darwin: ["/dev/cu.usbmodem*", "/dev/cu.usbserial*"]
    linux: ["/dev/alif-se", "/dev/ttyACM*", "/dev/ttyUSB*"]

  # Ports à écarter : ce ne sera jamais la carte. macOS expose en permanence
  # des pseudo-ports (Bluetooth, console de debug, debug Wi-Fi) qui rendaient
  # le choix du port « ambigu » alors qu'un seul candidat était réel.
  exclude_globs:
    darwin:
      - "/dev/*Bluetooth*"
      - "/dev/*debug-console*"
      - "/dev/*wlan-debug*"
      - "/dev/tty.*"
    linux: []

  # Garde-fou : refuser d'ouvrir la console à un débit qui n'est ni l'un ni
  # l'autre, sauf --force. Évite un `--baud 9600` qui ne sort que du binaire.
  allowed_bauds: [115200, 55000]
